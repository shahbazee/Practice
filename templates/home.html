{% extends "base.html" %}
{% load socialaccount %}
{% block content %}
<h1>Practice Project</h1>
{% if user.is_authenticated %}
<p>Welcome, {{ user.username }}.</p>
<p><a href="/payments/">View your payments</a></p>
{% else %}
<p>Please sign in to continue.</p>
<p><a href="{% provider_login_url 'google' %}">Sign in with Google</a></p>
<p><a href="/accounts/login/">Sign in with email</a></p>
{% endif %}
{% endblock %}
